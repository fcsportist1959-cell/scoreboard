<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Amateur Football Scoreboard PRO</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .scoreboard { 
            position: absolute; top: 25px; left: 25px; 
            display: flex; align-items: center; 
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.85)); 
            z-index: 1000; 
            cursor: grab; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        
        .brand-block { background: #1a1a1a; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #333; border-left: 6px solid #ffcc00; border-radius: 8px 0 0 8px; min-width: 125px; height: 110px; z-index: 2; box-sizing: border-box; }
        .logo-box { width: 112px; height: 64px; background: transparent; display: flex; align-items: center; justify-content: center; margin-top: 0px; margin-bottom: 2px; padding: 0px; box-sizing: border-box; filter: drop-shadow(0px 1px 2px rgba(255,255,255,0.1)); }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; transform: translateZ(0); backface-visibility: hidden; }
        
        .time-display { background: #111; color: #ffcc00; font-size: 24px; font-weight: bold; padding: 2px 10px; border-radius: 4px; border: 1px solid #333; min-width: 70px; text-align: center; font-family: monospace; }
        .match-block { display: flex; background: rgba(20, 20, 20, 0.95); border: 2px solid #333; border-left: none; border-radius: 0 8px 8px 0; height: 110px; box-sizing: border-box; overflow: hidden; }
        .team { display: flex; align-items: center; padding: 0 20px; min-width: 180px; }
        .team-name { color: #fff; font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .score { background: #151515; color: #fff; font-size: 48px; font-weight: 800; width: 80px; display: flex; align-items: center; justify-content: center; border-left: 1px solid #252525; border-right: 1px solid #252525; font-family: monospace; }
        .score-home { color: #fff; }
        .score-away { color: #fff; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <!-- ЛЯВ БЛОК С КОНТРАСТНО ЛОГО -->
        <div class="brand-block">
            <div class="logo-box">
                <!-- Заменете 'logo.png' с линка към вашето лого -->
                <img src="logo.png" alt="Logo">
            </div>
            <div class="time-display">00:00</div>
        </div>
        
        <!-- ДЕСЕН БЛОК С РЕЗУЛТАТ -->
        <div class="match-block">
            <div class="team team-home">
                <span class="team-name">Домакин</span>
            </div>
            <div class="score score-home">0</div>
            <div class="score score-away">0</div>
            <div class="team team-away">
                <span class="team-name">Гост</span>
            </div>
        </div>
    </div>

</body>
</html>
